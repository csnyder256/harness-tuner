name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The engine is standard library only. Installing pytest is the whole
      # setup, and if this ever needs more, the zero-dependency claim is broken.
      - name: Install the test runner and nothing else
        run: python -m pip install --upgrade pytest

      - name: Refuse any runtime dependency
        shell: bash
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          stdlib = set(sys.stdlib_module_names)
          allowed_outside = {"harness_tuner"}
          bad = []
          for path in pathlib.Path("harness_tuner").rglob("*.py"):
              tree = ast.parse(path.read_text(encoding="utf-8"))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [a.name.split(".")[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      if node.level:      # relative import, inside the package
                          continue
                      names = [(node.module or "").split(".")[0]]
                  else:
                      continue
                  for name in names:
                      if name and name not in stdlib and name not in allowed_outside:
                          bad.append(f"{path}: imports {name!r}")
          if bad:
              print("harness_tuner must import only the standard library:")
              print("\n".join(sorted(bad)))
              raise SystemExit(1)
          print("clean: every import in harness_tuner resolves to the standard library")
          PY

      - name: Unit tests
        run: python -m pytest tests/ -q

      - name: HTP-1 conformance
        run: python -m harness_tuner conformance

      - name: No decorative settings
        run: python tools/check_config_wiring.py

      - name: The CLI runs
        run: |
          python -m harness_tuner --version
          python -m harness_tuner doctor
          python -m harness_tuner packs
          python -m harness_tuner tasks

  hygiene:
    name: text hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Checked by raw bytes on purpose. grep -P '\x{2014}' returns zero hits on
      # thousands of real em-dashes when the runner locale is not UTF-8, and it
      # fails silently, which reads exactly like success.
      - name: No em-dashes, no mojibake
        shell: bash
        run: |
          fail=0
          for pattern in $'\xe2\x80\x94' $'\xe2\x80\x95' $'\xc3\x83' $'\xc3\xa2\xe2\x82\xac'; do
            if git grep -I -c -F -- "$pattern" -- . >/dev/null 2>&1; then
              echo "found a forbidden byte sequence:"
              git grep -I -n -F -- "$pattern" -- . | head -20
              fail=1
            fi
          done
          exit $fail

      - name: No example run output in the README
        shell: bash
        run: |
          # This repository publishes no measurement about any harness or model.
          # Guarding it in CI because it is the kind of thing that creeps back in
          # one helpful screenshot at a time.
          if grep -nE '^\s*\|?\s*(cost_usd|rework_ratio|cache_hit_ratio|step_efficiency)\s*\|' README.md docs/index.html 2>/dev/null; then
            echo "README or docs contain what looks like a measured result table"
            exit 1
          fi
          echo "clean: no measured results published"

  container:
    name: container image builds and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t harness-tuner:ci .
      - name: The image works with no local Python involved
        run: |
          docker run --rm harness-tuner:ci --version
          docker run --rm harness-tuner:ci conformance
          docker run --rm harness-tuner:ci doctor
