name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  verify:
    name: prove the tag before publishing it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pytest
      - run: python -m pytest tests/ -q
      - run: python -m harness_tuner conformance
      - run: python tools/check_config_wiring.py

      - name: The tag matches the version in the code
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code="$(python -c 'import harness_tuner; print(harness_tuner.__version__)')"
          if [ "$tag" != "$code" ]; then
            echo "tag $tag does not match harness_tuner.__version__ $code"
            exit 1
          fi
          echo "tag and code agree on $code"

  image:
    name: container image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  archive:
    name: source archive
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the archive
        run: |
          name="harness-tuner-${GITHUB_REF_NAME}"
          mkdir -p "dist/$name"
          cp -r harness_tuner packs conformance tools AGENT-GUIDE.md README.md LICENSE "dist/$name/"
          cd dist && tar -czf "$name.tar.gz" "$name" && zip -qr "$name.zip" "$name"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
          generate_release_notes: true
